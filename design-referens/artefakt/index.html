<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Spark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Castoro:ital@0;1&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="design.css">

<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="mk" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>
      </span>
      <span><b>Spark</b><small>AI-medgrundare</small></span>
    </div>
    <nav class="side-nav" id="sidenav" aria-label="Huvudmeny"></nav>
    <div class="side-foot">
      <div class="who">
        <span class="av">EÖ</span>
        <span><b>Elin Öberg</b><span>Göteborg</span></span>
      </div>
      <button class="restart" type="button" data-act="reset">Börja om demonstrationen</button>
    </div>
  </aside>

  <div class="mainwrap">
    <header class="topbar">
      <div class="topmark">Spark</div>
      <div class="crumb" id="crumb"></div>
      <button class="scorebtn" type="button" data-act="scoreto" id="scorebtn"></button>
    </header>
    <nav class="mobnav" id="mobnav" aria-label="Huvudmeny, liten skärm"></nav>
    <main class="view"><div class="inner" id="view"></div></main>
  </div>
</div>

<script src="app.js"></script>
<script src="design.js"></script>

</body></html>
